[project]
name = "melbourne-housing-pipeline"
version = "0.1.0"
description = "End-to-end pipeline over the Melbourne Housing Market dataset"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.0",
    "pyarrow>=17.0.0",
]

# Airflow is deliberately absent: its transitive pins conflict with dbt-core's if solved
# in the same environment, so install.sh --with-airflow builds .venv-airflow instead.

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
