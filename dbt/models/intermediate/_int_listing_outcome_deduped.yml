version: 2

models:
  - name: int__listing_outcome_clustered
    description: >
      Assigns every row a recapture cluster and a rank within it. This model exists so the
      surviving rows and the quarantined rows derive from one expression rather than two:
      `deduped` takes rank 1, `quarantine` takes the rest, and the two are complementary by
      construction. Computing the rule twice is how a clean table and its quarantine drift
      apart and start losing rows between them.

      A cluster breaks whenever consecutive appearances of the same business signature are
      more than `recapture_window_days` apart. Rows inside a cluster are republished snapshots
      of one event; rows in different clusters are genuinely separate campaigns.
    columns:
      - name: recapture_rank
        description: >
          1 for the earliest row in a cluster, ascending for each republication. Null on
          restatements, which are resolved before the recapture chain is built.
      - name: dq_status
        description: ok | suspected_restatement | suspected_recapture
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ok", "suspected_restatement", "suspected_recapture", "exact_duplicate"]
      - name: business_signature
        description: >
          Hash of every business column except the date. The artefact varies only the date, so
          any signature including the date is structurally blind to it.
        tests: [not_null]
      - name: surviving_event_date
        tests: [not_null]

  - name: int__listing_outcome_deduped
    description: One row per genuine listing outcome — the earliest appearance of each cluster.
    columns:
      - name: event_date
        tests: [not_null]
      - name: is_sold
        tests: [not_null]

  - name: quarantine_recaptured_listing
    description: >
      Rows excluded as republished snapshots, each carrying its reason and the event date it
      was collapsed into. Quarantined rather than deleted so the exclusion is provable,
      inspectable and challengeable — anyone who disputes the window can see exactly what it
      affected (ADR-0006).
    columns:
      - name: quarantine_key
        tests: [not_null, unique]
      - name: reason
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["suspected_recapture", "suspected_restatement", "exact_duplicate"]
      - name: surviving_event_date
        description: The event date of the row this one was collapsed into.
        tests: [not_null]

unit_tests:
  # ---------------------------------------------------------------- the clustering rule
  - name: a_five_week_republication_chain_becomes_one_cluster
    description: >
      The Christmas shutdown artefact in miniature: one snapshot republished weekly, then once
      more two days later. Five rows, one event — every row points at the same survivor.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: kew, street_address_key: "1 acacia pl", rooms: 2, type_code: u, method_code: VB, agent_key: jellis, sale_price: , bid_amount: 750000, event_date: "2017-12-16", source_row: 1}
          - {suburb_key: kew, street_address_key: "1 acacia pl", rooms: 2, type_code: u, method_code: VB, agent_key: jellis, sale_price: , bid_amount: 750000, event_date: "2017-12-23", source_row: 2}
          - {suburb_key: kew, street_address_key: "1 acacia pl", rooms: 2, type_code: u, method_code: VB, agent_key: jellis, sale_price: , bid_amount: 750000, event_date: "2017-12-30", source_row: 3}
          - {suburb_key: kew, street_address_key: "1 acacia pl", rooms: 2, type_code: u, method_code: VB, agent_key: jellis, sale_price: , bid_amount: 750000, event_date: "2018-01-06", source_row: 4}
          - {suburb_key: kew, street_address_key: "1 acacia pl", rooms: 2, type_code: u, method_code: VB, agent_key: jellis, sale_price: , bid_amount: 750000, event_date: "2018-01-08", source_row: 5}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2017-12-16", recapture_rank: 1, surviving_event_date: "2017-12-16", dq_status: ok}
        - {event_date: "2017-12-23", recapture_rank: 2, surviving_event_date: "2017-12-16", dq_status: suspected_recapture}
        - {event_date: "2017-12-30", recapture_rank: 3, surviving_event_date: "2017-12-16", dq_status: suspected_recapture}
        - {event_date: "2018-01-06", recapture_rank: 4, surviving_event_date: "2017-12-16", dq_status: suspected_recapture}
        - {event_date: "2018-01-08", recapture_rank: 5, surviving_event_date: "2017-12-16", dq_status: suspected_recapture}

  - name: a_relisting_months_later_starts_a_new_cluster
    description: >
      Identical on every column except the date, but 91 days apart — a property passed in
      twice at the same reserve with the same agent. A blanket rule would wrongly merge these.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: balwyn, street_address_key: "9 kenilworth st", rooms: 5, type_code: h, method_code: PI, agent_key: fletchers, sale_price: , bid_amount: 2700000, event_date: "2017-04-01", source_row: 1}
          - {suburb_key: balwyn, street_address_key: "9 kenilworth st", rooms: 5, type_code: h, method_code: PI, agent_key: fletchers, sale_price: , bid_amount: 2700000, event_date: "2017-07-01", source_row: 2}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2017-04-01", recapture_rank: 1, surviving_event_date: "2017-04-01"}
        - {event_date: "2017-07-01", recapture_rank: 1, surviving_event_date: "2017-07-01"}

  - name: exactly_twenty_one_days_apart_still_clusters
    description: The window is inclusive. Pinned so the boundary cannot drift silently.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: S, agent_key: nelson, sale_price: 900000, bid_amount: , event_date: "2017-04-01", source_row: 1}
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: S, agent_key: nelson, sale_price: 900000, bid_amount: , event_date: "2017-04-22", source_row: 2}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2017-04-01", recapture_rank: 1}
        - {event_date: "2017-04-22", recapture_rank: 2}

  - name: twenty_two_days_apart_breaks_the_cluster
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: S, agent_key: nelson, sale_price: 900000, bid_amount: , event_date: "2017-04-01", source_row: 1}
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: S, agent_key: nelson, sale_price: 900000, bid_amount: , event_date: "2017-04-23", source_row: 2}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2017-04-01", recapture_rank: 1}
        - {event_date: "2017-04-23", recapture_rank: 1}

  - name: a_different_price_is_a_different_signature
    description: >
      Same property, same agent, a week apart, but a different figure — a genuine second
      campaign, not a republished snapshot.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: brunswick, street_address_key: "70 gold st", rooms: 4, type_code: h, method_code: PI, agent_key: jellis, sale_price: , bid_amount: 1250000, event_date: "2017-04-01", source_row: 1}
          - {suburb_key: brunswick, street_address_key: "70 gold st", rooms: 4, type_code: h, method_code: PI, agent_key: jellis, sale_price: , bid_amount: 1300000, event_date: "2017-04-08", source_row: 2}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2017-04-01", recapture_rank: 1}
        - {event_date: "2017-04-08", recapture_rank: 1}

  - name: a_different_agent_is_a_different_signature
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: balwyn, street_address_key: "9 kenilworth st", rooms: 5, type_code: h, method_code: PI, agent_key: hockingstuart, sale_price: , bid_amount: 2700000, event_date: "2017-04-01", source_row: 1}
          - {suburb_key: balwyn, street_address_key: "9 kenilworth st", rooms: 5, type_code: h, method_code: PI, agent_key: fletchers, sale_price: , bid_amount: 2700000, event_date: "2017-04-08", source_row: 2}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2017-04-01", recapture_rank: 1}
        - {event_date: "2017-04-08", recapture_rank: 1}

  - name: byte_identical_rows_on_the_same_date_are_exact_duplicates
    description: >
      The file holds two of these. Same date and identical content, so it is neither a
      restatement (nothing changed) nor a recapture (the date did not move) — it is simply
      the same row twice, and the quarantine says so.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: S, agent_key: nelson, sale_price: 900000, bid_amount: , event_date: "2017-04-01", source_row: 1}
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: S, agent_key: nelson, sale_price: 900000, bid_amount: , event_date: "2017-04-01", source_row: 2}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2017-04-01", dq_status: ok}
        - {event_date: "2017-04-01", dq_status: exact_duplicate}

  - name: null_prices_compare_equal_within_a_signature
    description: >
      SN, PN, SS and W are 100% null-priced. If nulls did not compare equal, the artefact
      would survive untouched in exactly those methods.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: "airport west", street_address_key: "122 parer rd", rooms: 4, type_code: h, method_code: SN, agent_key: brad, sale_price: , bid_amount: , event_date: "2017-12-16", source_row: 1}
          - {suburb_key: "airport west", street_address_key: "122 parer rd", rooms: 4, type_code: h, method_code: SN, agent_key: brad, sale_price: , bid_amount: , event_date: "2017-12-23", source_row: 2}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2017-12-16", recapture_rank: 1}
        - {event_date: "2017-12-23", recapture_rank: 2}

  # ---------------------------------------------------------------- the two complementary filters
  - name: deduped_keeps_only_the_earliest_of_each_cluster
    model: int__listing_outcome_deduped
    given:
      - input: ref('int__listing_outcome_clustered')
        rows:
          - {event_date: "2017-12-16", dq_status: ok, is_sold: true}
          - {event_date: "2017-12-23", dq_status: suspected_recapture, is_sold: true}
          - {event_date: "2017-12-30", dq_status: suspected_recapture, is_sold: true}
          - {event_date: "2018-01-05", dq_status: exact_duplicate, is_sold: true}
          - {event_date: "2018-03-04", dq_status: ok, is_sold: false}
    expect:
      rows:
        - {event_date: "2017-12-16"}
        - {event_date: "2018-03-04"}


  - name: quarantine_takes_exactly_the_rows_deduped_dropped
    model: quarantine_recaptured_listing
    given:
      - input: ref('int__listing_outcome_clustered')
        rows:
          - {event_date: "2017-12-16", dq_status: ok, surviving_event_date: "2017-12-16", business_signature: sig, source_row: 1}
          - {event_date: "2017-12-23", dq_status: suspected_recapture, surviving_event_date: "2017-12-16", business_signature: sig, source_row: 2}
          - {event_date: "2017-12-30", dq_status: suspected_recapture, surviving_event_date: "2017-12-16", business_signature: sig, source_row: 3}
          - {event_date: "2018-02-03", dq_status: suspected_restatement, surviving_event_date: "2018-02-03", business_signature: sig2, source_row: 4}
    expect:
      rows:
        - {event_date: "2017-12-23", surviving_event_date: "2017-12-16", reason: suspected_recapture}
        - {event_date: "2017-12-30", surviving_event_date: "2017-12-16", reason: suspected_recapture}
        - {event_date: "2018-02-03", surviving_event_date: "2018-02-03", reason: suspected_restatement}

  # ---------------------------------------------------------------- restatement
  - name: a_later_disclosed_price_is_a_restatement_not_a_second_sale
    description: >
      One sale, recorded twice: once before the price was published and once after. A
      recapture varies the date and holds content constant; a restatement does the opposite,
      so the recapture rule cannot see it. Left unhandled, every sale whose price is later
      disclosed would be counted twice.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: toorak, street_address_key: "2/9 tintern av", rooms: 2, type_code: u, method_code: SP, agent_key: marshall, sale_price: , bid_amount: , event_date: "2016-09-24", source_row: 1}
          - {suburb_key: toorak, street_address_key: "2/9 tintern av", rooms: 2, type_code: u, method_code: SP, agent_key: marshall, sale_price: 851000, bid_amount: , event_date: "2016-09-24", source_row: 2}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2016-09-24", sale_price: 851000, dq_status: ok}
        - {event_date: "2016-09-24", sale_price: , dq_status: suspected_restatement}

  - name: the_most_informative_row_wins_a_restatement
    description: A disclosed price is strictly more informative than a null one, whatever the row order.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: "port melbourne", street_address_key: "224 nott st", rooms: 3, type_code: h, method_code: SP, agent_key: greg, sale_price: 1405000, bid_amount: , event_date: "2016-07-30", source_row: 1}
          - {suburb_key: "port melbourne", street_address_key: "224 nott st", rooms: 3, type_code: h, method_code: SP, agent_key: greg, sale_price: , bid_amount: , event_date: "2016-07-30", source_row: 2}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2016-07-30", sale_price: 1405000, dq_status: ok}
        - {event_date: "2016-07-30", sale_price: , dq_status: suspected_restatement}

  - name: two_genuinely_different_prices_on_one_day_still_collapse
    description: >
      The same property cannot be sold twice by the same agent on the same day under the same
      method. Whatever the two figures mean, they describe one event.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: S, agent_key: nelson, sale_price: 900000, bid_amount: , event_date: "2017-04-01", source_row: 1}
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: S, agent_key: nelson, sale_price: 910000, bid_amount: , event_date: "2017-04-01", source_row: 2}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2017-04-01", sale_price: 900000, dq_status: ok}
        - {event_date: "2017-04-01", sale_price: 910000, dq_status: suspected_restatement}

  - name: a_restatement_does_not_pollute_the_recapture_chain
    description: >
      A duplicate on day one must not become the lag anchor for the following week, or the
      recapture gap would be measured from the wrong row.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: kew, street_address_key: "1 acacia pl", rooms: 2, type_code: u, method_code: VB, agent_key: jellis, sale_price: , bid_amount: 750000, event_date: "2017-12-16", source_row: 1}
          - {suburb_key: kew, street_address_key: "1 acacia pl", rooms: 2, type_code: u, method_code: VB, agent_key: jellis, sale_price: , bid_amount: , event_date: "2017-12-16", source_row: 2}
          - {suburb_key: kew, street_address_key: "1 acacia pl", rooms: 2, type_code: u, method_code: VB, agent_key: jellis, sale_price: , bid_amount: 750000, event_date: "2017-12-23", source_row: 3}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2017-12-16", dq_status: ok, recapture_rank: 1}
        - {event_date: "2017-12-16", dq_status: suspected_restatement, recapture_rank: }
        - {event_date: "2017-12-23", dq_status: suspected_recapture, recapture_rank: 2}

  # ---------------------------------------------------------------- ordering across loads
  - name: a_later_load_wins_a_restatement
    description: >
      A 2001 sale arrives today with its price finally published. The newer load must win.
      Ordering by source_row cannot decide this - row 5 of a small delta against row 40,000
      of the historical load says nothing about which is current.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: SP, agent_key: nelson, sale_price: , bid_amount: , event_date: "2001-06-15", source_row: 40000, load_started_at: "2001-07-01 06:00:00"}
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: SP, agent_key: nelson, sale_price: 450000, bid_amount: , event_date: "2001-06-15", source_row: 5, load_started_at: "2026-08-28 06:00:00"}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2001-06-15", sale_price: 450000, dq_status: ok}
        - {event_date: "2001-06-15", sale_price: , dq_status: suspected_restatement}

  - name: a_later_load_wins_even_when_it_carries_less_detail
    description: >
      If the source retracts a price, recency still wins. The feed is authoritative about its
      own current state, and silently preferring the older figure would mean the warehouse
      disagreed with the source forever.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: SP, agent_key: nelson, sale_price: 450000, bid_amount: , event_date: "2001-06-15", source_row: 1, load_started_at: "2001-07-01 06:00:00"}
          - {suburb_key: kew, street_address_key: "2 bay rd", rooms: 3, type_code: h, method_code: SP, agent_key: nelson, sale_price: , bid_amount: , event_date: "2001-06-15", source_row: 1, load_started_at: "2026-08-28 06:00:00"}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2001-06-15", sale_price: , dq_status: ok}
        - {event_date: "2001-06-15", sale_price: 450000, dq_status: suspected_restatement}

  - name: within_one_load_the_most_informative_row_still_wins
    description: >
      Recency cannot discriminate inside a single snapshot, so the informativeness rule
      remains the tie-break - this is the 2/9 Tintern Av case from the original file.
    model: int__listing_outcome_clustered
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__listing_outcome')
        rows:
          - {suburb_key: toorak, street_address_key: "2/9 tintern av", rooms: 2, type_code: u, method_code: SP, agent_key: marshall, sale_price: , bid_amount: , event_date: "2016-09-24", source_row: 1, load_started_at: "2026-08-28 06:00:00"}
          - {suburb_key: toorak, street_address_key: "2/9 tintern av", rooms: 2, type_code: u, method_code: SP, agent_key: marshall, sale_price: 851000, bid_amount: , event_date: "2016-09-24", source_row: 2, load_started_at: "2026-08-28 06:00:00"}
      - input: ref('stg__listing_outcome')
        rows: []
    expect:
      rows:
        - {event_date: "2016-09-24", sale_price: 851000, dq_status: ok}
        - {event_date: "2016-09-24", sale_price: , dq_status: suspected_restatement}
