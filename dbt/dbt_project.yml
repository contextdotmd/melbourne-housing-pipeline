name: melbourne_housing_pipeline
version: 1.0.0
config-version: 2
profile: melbourne_housing_pipeline

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Register the Parquet landing zone as a real view before anything runs. dbt-duckdb can
# express this as a source `external_location` instead, but such a source never exists as a
# catalog relation, so dbt cannot introspect its columns when building unit-test fixtures.
# A real view also means the landing zone is queryable directly in the DuckDB UI.
# This makes ingestion a hard prerequisite of any dbt invocation, which it already was.
on-run-start:
  - "create schema if not exists landing"
  - >
    create or replace view landing.listing_outcome as
    select * from read_parquet('data/landing/listing_outcome/*/*.parquet')

vars:
  # Consecutive appearances of an identical business signature closer together than this are
  # treated as one event republished, not several events. Observed gaps cluster at 2 and 7
  # days; the next is 14, then 49 - so this boundary sits in empty space (ADR-0006).
  recapture_window_days: 21

  # The reprocessing window a future incremental build would use (docs/incremental-design.md).
  # Declared and asserted now, while the pipeline is still full-refresh, so the number is
  # known to be safe before anything depends on it. assert_no_cluster_exceeds_lookback.sql
  # fails the build if any dedup cluster ever grows past it.
  incremental_lookback_days: 90

models:
  melbourne_housing_pipeline:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    analytics:
      +schema: analytics
      +materialized: view

seeds:
  melbourne_housing_pipeline:
    +schema: seed
    +quote_columns: false
