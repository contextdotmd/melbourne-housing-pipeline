name: melbourne_housing_pipeline
version: 1.0.0
config-version: 2
profile: melbourne_housing_pipeline

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Register the Parquet landing zone as a real view before anything runs. dbt-duckdb can
# express this as a source `external_location` instead, but such a source never exists as a
# catalog relation, so dbt cannot introspect its columns when building unit-test fixtures.
# A real view also means the landing zone is queryable directly in the DuckDB UI.
# This makes ingestion a hard prerequisite of any dbt invocation, which it already was.
on-run-start:
  - "create schema if not exists landing"
  - >
    create or replace view landing.listing_outcome as
    select * from read_parquet('{{ var("data_root", "data") }}/landing/listing_outcome/*/*.parquet')
  # The receipts are not just an audit artefact: they carry started_at, which is the only
  # thing that can order one load against another. load_id is a content hash and does not
  # sort, and source_row is meaningful only inside its own file.
  - >
    create or replace view landing.ingest_receipt as
    select * from read_json_auto('{{ var("data_root", "data") }}/ingest_receipt/*.json')

vars:
  # Consecutive appearances of an identical business signature closer together than this are
  # treated as one event republished, not several events. Gaps of 21 days or less cluster at
  # 2 and 7 days; the nearest gap above the window is 28 days, so the boundary sits in the
  # empty stretch between 21 and 28 (ADR-0006).
  recapture_window_days: 21

  # The reprocessing window the BigQuery port's partition-pruned incremental build would use
  # (docs/warehouse-physical-design.md). The shipped DuckDB build reprocesses whole properties
  # and does not depend on it; it is declared and asserted anyway so the number is known to be
  # safe before that port does. assert_no_cluster_exceeds_lookback.sql fails the build if any
  # dedup cluster ever grows past it.
  incremental_lookback_days: 90

  # Where the loader wrote. Overridable so a build can be pointed at an alternate landing
  # zone without touching the project — used by the two-load demo in docs/.
  data_root: data

models:
  melbourne_housing_pipeline:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
    analytics:
      +schema: analytics
      +materialized: view

seeds:
  melbourne_housing_pipeline:
    +schema: seed
    +quote_columns: false
